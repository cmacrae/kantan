name: calendar
type: command
placement: right
style:
  fg: "{theme(blue)}"
config:
  command: kantan-plugin-calendar
  output: json
  watch: kantan-plugin-calendar --watch
  settings:
    format: "{next_title}{?upcoming: in} {next_countdown}"
    upcoming: 1d
    calendars:
      include:
        - Kantan Testing
interaction:
  hover:
    type: tooltip
    view:
      type: vstack
      spacing: 4
      children:
        - type: text
          content: "Next: {next_title}"
          weight: medium
        - type: text
          content: "{next_countdown}"
          style: secondary
  click:
    type: menu
