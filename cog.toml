# Conventional commit checks and version bumps: `cog check`, `cog bump --auto`.
tag_prefix = "v"
branch_whitelist = ["main"]
# Release notes go in the GitHub Release, from `cog changelog`.
disable_changelog = true
pre_bump_hooks = ["printf '%s\n' {{version}} > VERSION"]
# cog doesn't sign tags; replace its tag with a signed, annotated one.
post_bump_hooks = ["git tag -f -s -m v{{version}} v{{version}}"]

# The parts of kantan, then the tooling around it.
scopes = [
  # The app
  "bar", "config", "cli", "display", "events", "interaction", "masking", "dsl", "theme", "icons",
  # Built-in modules
  "bluetooth", "clock", "command", "drawer", "focus", "icon", "power", "text", "volume", "waveform", "wifi", "workspace", "modules",
  # Bundled plugins
  "plugins", "caffeine", "calendar", "now-playing", "pomodoro", "reminders", "rift-indicator", "system-monitor", "tailscale",
  # Packaging and tooling, for types that don't bump
  "nix", "homebrew", "release", "install",
]

# Only feat and fix bump the version, and only for changes to what kantan
# does. Packaging, the docs, the site and CI use types that don't bump.
[commit_types]
site = { changelog_title = "Site", omit_from_changelog = true }

# `cog install-hook pre-push` installs this, and the dev shell does too. It
# checks the commits being pushed, then runs Git LFS's own step when Git LFS
# is installed, as the hook Git LFS installs does.
[git_hooks.pre-push]
script = """#!/bin/sh
# kantan: checks the commits being pushed
set -e
refs=$(cat)
printf '%s\\n' "$refs" | nix run .#check-commits -- --pre-push
if command -v git-lfs >/dev/null 2>&1; then
  printf '%s\\n' "$refs" | git lfs pre-push "$@"
fi
"""
