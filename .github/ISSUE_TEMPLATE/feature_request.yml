name: Feature request
description: Suggest something kantan could do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you'd like to do
      description: What you're trying to do with your bar, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could work
      description: What you have in mind, such as a config snippet you'd like to write.
  - type: textarea
    id: alternatives
    attributes:
      label: What you've tried
      description: Any workaround you use now, such as a plugin or another module.
