name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Runs CI on any branch by hand: `gh workflow run CI --ref <branch>`.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The commit messages, and a run of the app. A run by hand has no pushed
  # commits to check.
  commits-and-smoke:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # cog reads the commits being checked.
          fetch-depth: 0
          persist-credentials: false

      # kantan's builds and tests use AppKit, which reads system files the
      # Nix sandbox hides, so the sandbox stays off in every job, as on a
      # local macOS Nix install.
      - uses: cachix/install-nix-action@v31.11.5
        with:
          extra_nix_config: |
            sandbox = false

      - name: Check commit messages
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # The commits this push or pull request adds. A force push leaves
          # the old head out of the checkout, so the rewritten commits start
          # after its merge base with the new head. A new branch, or a history
          # rewritten from its first commit, has no earlier commit to start
          # from, so every commit is checked.
          RANGE="$BASE..$HEAD"
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="$HEAD"
          elif ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            if BASE=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" --jq .merge_base_commit.sha); then
              RANGE="$BASE..$HEAD"
            else
              RANGE="$HEAD"
            fi
          fi
          nix run .#check-commits -- "$RANGE"

      - name: Smoke test
        run: nix run . -- --version

  # kantan's tests, on a runner of their own: they build kantan for testing,
  # apart from the builds the other checks use.
  tests:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@v31.11.5
        with:
          extra_nix_config: |
            sandbox = false

      - name: Tests
        run: nix build --no-link --print-build-logs .#checks.aarch64-darwin.kantan-tests

  # Every flake output evaluating, and every check but the tests building.
  checks:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@v31.11.5
        with:
          extra_nix_config: |
            sandbox = false

      - name: Evaluate
        run: nix flake check --no-build

      - name: Checks
        run: |
          nix eval --raw .#checks.aarch64-darwin --apply '
            checks: builtins.concatStringsSep "\n" (
              map (name: ".#checks.aarch64-darwin." + name)
                (builtins.attrNames (removeAttrs checks [ "kantan-tests" ])))
          ' | xargs nix build --no-link --print-build-logs

  # Every action the workflows use matches the commit actions.lock records.
  actions-lock:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Verify actions.lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.1
          gh actions-lock --verify
