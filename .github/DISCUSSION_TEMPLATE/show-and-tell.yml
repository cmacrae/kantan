body:
  - type: textarea
    id: preview
    attributes:
      label: Preview
      description: An image of your bar, theme or module, with its link under it. Post to Discussions in the builder fills in the link and copies the image, so paste it here. Or drag in a screenshot.
    validations:
      required: true
  - type: textarea
    id: about
    attributes:
      label: About it
      description: What it is, the plugins you've written or anything you're pleased with.
  - type: textarea
    id: config
    attributes:
      label: Config
      description: Without a builder link, your `~/.config/kantan/config.yaml` or a link to your dotfiles, so others can borrow from it.
      render: yaml
