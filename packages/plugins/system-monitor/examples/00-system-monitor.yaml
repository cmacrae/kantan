name: system-monitor
type: command
placement: right
icon: activity
style:
  fg: "{theme(green)}"
config:
  command: kantan-plugin-system-monitor
  output: json
  interval: 3
  settings:
    style:
      cpu_low: "{theme(green)}"
      cpu_medium: "{theme(yellow)}"
      cpu_high: "{theme(peach)}"
      cpu_critical: "{theme(red)}"
      thermal_nominal: "{theme(green)}"
      thermal_fair: "{theme(yellow)}"
      thermal_serious: "{theme(peach)}"
      thermal_critical: "{theme(red)}"
    process_count: 5
    show_cores: false
    # icons:
    #   cpu: cpu
    #   memory: script
    #   disk: device-floppy
    #   thermal_nominal: thermometer
    #   thermal_fair: thermometer
    #   thermal_serious: thermometer
    #   thermal_critical: thermometer
    #   uptime: clock
    #   load: graph
    #   activity_monitor: dashboard
interaction:
  hover:
    type: tooltip
    content: "CPU {cpu} | Mem {mem} | {thermal}"
  click:
    type: menu
