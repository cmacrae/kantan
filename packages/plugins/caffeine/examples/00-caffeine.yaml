name: caffeine
type: command
placement: right
icon: "coffee"
style:
  fg: "{theme(yellow)}"
config:
  command: kantan-plugin-caffeine
  output: json
  interval: 0
  toggle: kantan-plugin-caffeine --toggle
interaction:
  hover:
    type: tooltip
    content: "Caffeine: {status}"
  click:
    type: toggle
