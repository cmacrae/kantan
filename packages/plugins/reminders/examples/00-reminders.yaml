name: todo
type: command
placement: right
icon: bell-filled
style:
  fg: "{theme(text)}"
  bg: "{theme(surface0)}"
  shape: box
  icon:
    fg: "{theme(maroon)}"
config:
  command: kantan-plugin-reminders
  output: json
  watch: kantan-plugin-reminders --watch
  settings:
    format: "{title}"
    persist: true
    progress: true
    lists:
      - name: Reminders
        icon: bell-filled
        lookahead: 10m
        overdue: true
        undated: false
        completedRetention: 1h
        maxChars: 30
interaction:
  hover:
    type: tooltip
    content: "{count} reminders"
  click:
    type: menu
