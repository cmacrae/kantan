name: pomodoro
type: command
placement: right
style:
  fg: "{theme(red)}"
config:
  command: kantan-plugin-pomodoro
  output: json
  interval: 1
  settings:
    format: "{remaining}"
    work_duration: 25
    short_break: 5
    long_break: 15
    long_break_interval: 4
    auto_start_breaks: true
    auto_start_work: false
interaction:
  hover:
    type: tooltip
    content: "{mode} — {remaining}"
  click:
    type: menu
    items:
      - header: "Pomodoro"
      - dynamic: true
