name: pomodoro
type: command
alignment: right
icon: "\uf253"
style:
  light:
    fg: "#e06c75"
  dark:
    fg: "#f38ba8"
config:
  command: kantan-plugin-pomodoro
  output: json
  interval: 1
  settings:
    format: "{remaining}"
    work_duration: 25
    short_break: 5
    long_break: 15
    long_break_interval: 4
    auto_start_breaks: true
    auto_start_work: false
    # icons:
    #   idle: "\uf111"        # circle
    #   work: "\uf253"        # hourglass-half
    #   short_break: "\uf186" # moon
    #   long_break: "\uf186"  # moon
interaction:
  hover:
    type: tooltip
    content: "{mode} — {remaining}"
  click:
    type: menu
    items:
      - header: "Pomodoro"
      - dynamic: true
