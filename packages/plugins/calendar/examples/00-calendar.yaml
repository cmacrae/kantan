name: calendar
type: command
placement: right
style:
  fg: "{theme(blue)}"
config:
  command: kantan-plugin-calendar
  output: json
  watch: kantan-plugin-calendar --watch
  settings:
    format:
      - text: "{next_title} "
        fg: "{theme(blue)}"
      - text: "in {next_countdown}"
        fg: "{theme(overlay1)}"
        when: upcoming
      - text: now
        fg: "{theme(red)}"
        when: active
    upcoming: 1h
    calendars:
      include:
        - Work
        - Personal
interaction:
  hover:
    type: tooltip
    view:
      type: vstack
      spacing: 4
      children:
        - type: text
          content: "Next: {next_title}"
          weight: medium
        - type: text
          content: "{next_countdown}"
          style: secondary
  click:
    type: menu
