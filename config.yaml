global:
  height: 35
  padding: 10
  textFont: "Helvetica Neue"
  iconFont: "FontAwesome:Regular:15"
  colour:
    light:
      bg: "#bfccb5"
      fg: "#65647c"
    dark:
      fg: "#f7f5eb"
      bg: "#7c96ab"

modules:
  - name: left 1
    type: text
    alignment: left
    icon: 
    config:
      value: one
  - name: left 2
    type: text
    alignment: left
    config:
      value: two
  - name: clock
    type: clock
    alignment: right
    icon: 
    config:
      format: "H:mm"
  - name: power
    type: power
    alignment: right
    config:
      showLevel: true
      charging:
        icon: 
      battery:
        icons:
          - 
          - 
          - 
          - 
          - 
