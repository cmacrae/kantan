global:
  height: 35
  padding: 10
  textFont: "Helvetica Neue"
  iconFont: "FontAwesome:Regular:15"
  colour:
    light:
      bg: "#bfccb5"
      fg: "#65647c"
    dark:
      fg: "#f7f5eb"
      bg: "#7c96ab"

modules:
  - name: user
    type: command
    alignment: left
    icon: 
    config:
      command: whoami
      # command: echo $RANDOM
      # launcher:
      #   path: ~/.nix-profile/bin/zsh
      #   args: [ '-c' ]
    interaction:
      hover:
        type: tooltip
        content: "Logged in as: {value}"
  - name: spaces
    type: workspace
    alignment: left
    config:
      type: aerospace
      defaultIcon: ●
      activeColour: "#ffffff"
  - name: left 2
    type: text
    alignment: left
    config:
      value: static text
  - name: clock
    type: clock
    alignment: right
    icon: 
    config:
      format: "HH:mm:ss"
    interaction:
      hover:
        type: tooltip
        content: "{day}, {date}"
      click:
        type: popup
        popup: calendar
  - name: power
    type: power
    alignment: right
    config:
      showLevel: false
      charging:
        icon: 
      battery:
        icons:
          - 
          - 
          - 
          - 
          - 
    interaction:
      hover:
        type: tooltip
        content: "{level}% — {state}"
      click:
        type: popup
        popup: battery-detail
  - name: todo
    type: reminders
    alignment: right
    icon: 
    config:
      list: kantan testing
