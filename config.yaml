global:
  height: 35
  padding: 10
  textFont: "Helvetica Neue"
  iconFont: "FontAwesome:Regular:15"
  colour:
    light:
      bg: "#bfccb5"
      fg: "#65647c"
    dark:
      fg: "#f7f5eb"
      bg: "#7c96ab"

modules:
  - name: user
    type: command
    alignment: left
    icon: 
    config:
      command: whoami
      # command: echo $RANDOM
      # launcher:
      #   path: ~/.nix-profile/bin/zsh
      #   args: [ '-c' ]
  - name: left 2
    type: text
    alignment: left
    config:
      value: static text
  - name: clock
    type: clock
    alignment: right
    icon: 
    config:
      format: "HH:mm:ss"
  - name: power
    type: power
    alignment: right
    config:
      showLevel: true
      charging:
        icon: 
      battery:
        icons:
          - 
          - 
          - 
          - 
          - 
  - name: todo
    type: reminders
    alignment: right
    icon: 
    config:
      list: kantan testing
