height: 35
padding: 10
textFont: "Helvetica Neue"
iconFont: "FontAwesome:Regular:15"
appearance: theme
style:
  light:
    bg: "#303446"
    fg: "#c6d0f5"
  dark:
    fg: "#cdd6f4"
    bg: "#1e1e2e"

modules:
  # - name: user
  #   type: command
  #   alignment: left
  #   icon: 
  #   config:
  #     command: whoami
  #   interaction:
  #     hover:
  #       type: tooltip
  #       content: "Logged in as: {value}"
  - name: spaces
    type: workspace
    alignment: left
    config:
      type: aerospace
      defaultIcon: ●
      activeColour: "#ffffff"

  - name: caffeine
    type: caffeinate
    alignment: right
    icon: 
    style:
      light:
        fg: "#e5c890"
      dark:
        fg: "#f9e2af"
    interaction:
      hover:
        type: tooltip
        content: "Caffiene: {status}"
      click:
        type: toggle

  - name: todo
    type: reminders
    alignment: right
    icon: 
    style:
      light:
        icon:
          fg: "#ca9ee6"
        fg: "#c6d0f5"
        shape: box
        bg: "#414559"
      dark:
        icon:
          fg: "#cba6f7"
        fg: "#cdd6f4"
        shape: box
        bg: "#313244"
    config:
      list: kantan testing

  - name: bluetooth
    type: bluetooth
    alignment: right
    config:
      showCount: false
      icon: 
      disabledIcon: 
    style:
      light:
        fg: "#8caaee"
      dark:
        fg: "#89b4fa"
    mask:
      name: Bluetooth

  - name: volume
    type: volume
    alignment: right
    config:
      showLevel: false
      mutedIcon: 
      icons:
        - 
        - 
        - 
    mask:
      name: Volume

  - name: wifi
    type: wifi
    alignment: right
    config:
      showSSID: false
      disconnectedIcon: 直
      icons:
        - 
        - 
        - 
    mask:
      name: WiFi

  - name: power
    type: power
    alignment: right
    config:
      showLevel: false
      charging:
        icon: 
      battery:
        icons:
          - 
          - 
          - 
          - 
          - 
    mask:
      name: Battery

  - name: control-centre
    type: icon
    alignment: right
    icon: 
    mask:
      name: ControlCenter

  - name: clock
    type: clock
    alignment: right
    config:
      format: "HH:mm"
    mask:
      name: Clock
