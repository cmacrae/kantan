global:
  height: 35
  padding: 10
  textFont: "Helvetica Neue"
  iconFont: "FontAwesome:Regular:15"
  appearance: native
  # appearance: theme
  colour:
    light:
      bg: "#bfccb5"
      fg: "#65647c"
    dark:
      fg: "#f7f5eb"
      bg: "#7c96ab"

modules:
  # - name: user
  #   type: command
  #   alignment: left
  #   icon: 
  #   config:
  #     command: whoami
  #     # command: echo $RANDOM
  #     # launcher:
  #     #   path: ~/.nix-profile/bin/zsh
  #     #   args: [ '-c' ]
  #   interaction:
  #     hover:
  #       type: tooltip
  #       content: "Logged in as: {value}"
  - name: spaces
    type: workspace
    alignment: left
    config:
      type: aerospace
      defaultIcon: ●
      activeColour: "#ffffff"

  - name: caffeine
    type: caffeinate
    alignment: right
    icon: 
    interaction:
      hover:
        type: tooltip
        content: "Caffiene: {status}"
      click:
        type: toggle

  - name: todo
    type: reminders
    alignment: right
    icon: 
    config:
      list: kantan testing

  - name: bluetooth
    type: bluetooth
    alignment: right
    config:
      showCount: false
      icon: 
      disabledIcon: 
    mask:
      name: Bluetooth

  - name: volume
    type: volume
    alignment: right
    config:
      showLevel: false
      mutedIcon: 
      icons:
        - 
        - 
        - 
    mask:
      name: Volume

  - name: wifi
    type: wifi
    alignment: right
    config:
      showSSID: false
      disconnectedIcon: 直
      icons:
        - 
        - 
        - 
    mask:
      name: WiFi

  - name: power
    type: power
    alignment: right
    config:
      showLevel: false
      charging:
        icon: 
      battery:
        icons:
          - 
          - 
          - 
          - 
          - 
    mask:
      name: Battery

  - name: control-centre
    type: icon
    alignment: right
    icon: ""
    mask:
      name: ControlCenter

  - name: clock
    type: clock
    alignment: right
    config:
      format: "HH:mm"
    mask:
      name: Clock
