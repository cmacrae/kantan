<!DOCTYPE html>
<html lang="en">

      --muted: rgba(25, 25, 24, 0.4);
      --sub: rgba(25, 25, 24, 0.55);
      --link: #b5502f;
    }
    @media (prefers-color-scheme: dark) {

        --bg: #141413;

      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, sans-serif;

    }
    .message { font-size: 19px; color: var(--sub); margin-top: 28px; line-height: 1.5; }
    nav { display: flex; gap: 24px; margin-top: 20px; font-size: 15px; font-weight: 500; }
    a { color: var(--link); text-decoration: none; }
