theme:
  light: catppuccin[latte]
  dark: catppuccin[mocha]

modules:
  # Workspace indicators on the left
  - name: spaces
    type: workspace
    placement: left
    icon: point-filled
    config:
      rainbow:
        enabled: true
        colors:
          - "{theme(red)}"
          - "{theme(peach)}"
          - "{theme(green)}"
          - "{theme(sky)}"
          - "{theme(mauve)}"
          - "{theme(pink)}"

  # Drawer contents
  - name: system-monitor
    type: command
    placement: right
    icon: activity
    config:
      command: kantan-plugin-system-monitor
      output: json
    interaction:
      hover:
        type: tooltip
        content: "CPU {cpu} | Mem {mem} | {thermal}"
      click:
        type: menu

  - name: reminders
    type: command
    placement: right
    icon: bell-filled
    style:
      shape: box
      icon:
        fg: "{theme(maroon)}"
    config:
      command: kantan-plugin-reminders
      output: json
      watch: kantan-plugin-reminders --watch
      interval: 0
      settings:
        lists:
          - name: Reminders
            completedRetention: 1h
    interaction:
      click:
        type: menu

  - name: drawer
    type: drawer
    placement: right
    style:
      fg: "{theme(overlay0)}"

  # Always visible
  - name: caffeine
    type: command
    placement: right
    icon: mug-filled
    style:
      fg: "{theme(rosewater)}"
    config:
      command: kantan-plugin-caffeine
      output: json
      interval: 0
      toggle: kantan-plugin-caffeine --toggle
    interaction:
      hover:
        type: tooltip
        content: "Caffeine: {status}"
      click:
        type: toggle

  - name: focus
    type: focus
    placement: right
    icon: brain
    style:
      fg: "{theme(pink)}"
    mask:
      name: Focus
    interaction:
      hover:
        type: tooltip
        content: "{mode}"

  - name: bluetooth
    type: bluetooth
    placement: right
    style:
      fg: "{theme(blue)}"
    mask:
      name: Bluetooth
    interaction:
      hover:
        type: tooltip
        content: "{state}"

  - name: volume
    type: volume
    placement: right
    style:
      fg: "{theme(lavender)}"
    mask:
      name: Volume
    interaction:
      hover:
        type: tooltip
        content: "{state}"

  - name: wifi
    type: wifi
    placement: right
    style:
      fg: "{theme(sky)}"
    mask:
      name: WiFi
    interaction:
      hover:
        type: tooltip
        content: "{state}"

  - name: power
    type: power
    placement: right
    style:
      fg: "{theme(subtext1)}"
    mask:
      name: Battery
    interaction:
      hover:
        type: tooltip
        content: "{level}%, {state}"

  - name: control-centre
    type: icon
    placement: right
    icon: adjustments-horizontal-filled
    style:
      fg: "{theme(mauve)}"
    mask:
      name: ControlCenter
    interaction:
      hover:
        type: tooltip
        content: "Control Centre"

  - name: clock
    type: clock
    placement: right
    style:
      fg: "{theme(flamingo)}"
    config:
      format: "HH:mm"
      formats:
        date: "E MMM do"
    mask:
      name: Clock
    interaction:
      hover:
        type: tooltip
        content: "{date}"
