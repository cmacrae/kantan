[book]
title = "kantan · Documentation"
authors = ["Calum MacRae"]
description = "Documentation for kantan, a beautifully simple status bar for macOS: installation, configuration, modules, plugins and themes"
language = "en"
src = "src"

[output.html]
default-theme = "light"
preferred-dark-theme = "coal"
additional-css = ["theme/kantan.css"]
additional-js = ["theme/preview-loader.js"]
site-url = "/docs/"
git-repository-url = "https://github.com/cmacrae/kantan"
git-repository-icon = "fab-github"
no-section-label = true

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
boost-title = 2
